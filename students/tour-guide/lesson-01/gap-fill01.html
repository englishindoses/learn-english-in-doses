  <script>
    document.addEventListener('DOMContentLoaded', function() {

      // Question bank. ___ marks the gap. "before" is an optional line shown
      // ahead of the gap, for replies. The first option is the answer;
      // options are mixed up on screen. Every round takes a set number from
      // each group, preferring questions not seen yet.
      var bank = {
        greetings: [
          { who: 'Guide', text: 'Good ___, everyone! Welcome to Cachoeiras.', options: ['morning', 'meet', 'from'] },
          { who: 'Guide', text: 'Welcome ___ Cachoeiras!', options: ['to', 'at', 'of'] },
          { who: 'Tourist', text: 'Nice to ___ you.', options: ['meet', 'name', 'like'] },
          { who: 'Guide', text: 'See you ___! Thank you very much.', options: ['later', 'from', 'name'] }
        ],
        introductions: [
          { who: 'Guide', text: 'My name ___ Paulo.', options: ['is', 'am', 'are'] },
          { who: 'Guide', text: "I'm your ___ today.", options: ['guide', 'name', 'tree'] },
          { who: 'Guide', text: '___ your name?', options: ["What's", "Where's", "Who's"] },
          { who: 'Guide', text: '___ are you from?', options: ['Where', 'What', 'How'] },
          { who: 'Tourist', text: "I'm ___ Germany.", options: ['from', 'of', 'at'] }
        ],
        likes: [
          { who: 'Guide', text: "I ___ birds. They're beautiful.", options: ['like', 'likes', 'liking'] },
          { who: 'Tourist', text: "I don't ___ snakes.", options: ['like', 'likes', 'liking'] },
          { who: 'Guide', text: '___ you like waterfalls?', options: ['Do', 'Are', 'Is'] },
          { before: { who: 'Guide', text: 'Do you like monkeys?' }, who: 'Tourist', text: 'Yes, I ___.', options: ['do', 'am', 'like'] },
          { before: { who: 'Guide', text: 'Do you like snakes?' }, who: 'Tourist', text: 'No, I ___.', options: ["don't", 'not', 'am not'] }
        ],
        nature: [
          { who: 'Guide', text: "Listen! Can you hear the ___? It's singing.", options: ['bird', 'tree', 'river'] },
          { who: 'Guide', text: "Be careful! There's a ___ on the path.", options: ['snake', 'flower', 'waterfall'] },
          { who: 'Guide', text: 'Look at the ___! The water is very cold.', options: ['waterfall', 'bird', 'tree'] },
          { who: 'Guide', text: 'We can swim in the ___.', options: ['river', 'tree', 'bird'] },
          { who: 'Guide', text: 'This ___ is 200 years old.', options: ['tree', 'bird', 'flower'] },
          { who: 'Guide', text: "Look! A ___ in the tree. It's eating a banana.", options: ['monkey', 'snake', 'flower'] },
          { who: 'Guide', text: 'This ___ is red and yellow. It smells nice.', options: ['flower', 'monkey', 'river'] },
          { who: 'Guide', text: 'We walk in the ___ for two hours.', options: ['forest', 'bird', 'flower'] }
        ]
      };
      var perRound = { greetings: 1, introductions: 2, likes: 2, nature: 3 };

      var activity = document.getElementById('gapFill');
      var queues = {};

      function shuffle(items) {
        var copy = items.slice();
        for (var i = copy.length - 1; i > 0; i--) {
          var j = Math.floor(Math.random() * (i + 1));
          var tmp = copy[i]; copy[i] = copy[j]; copy[j] = tmp;
        }
        return copy;
      }

      // Take n questions from a group, working through the group before repeating
      function take(group, n) {
        var picked = [];
        queues[group] = queues[group] || [];
        while (picked.length < n) {
          if (!queues[group].length) {
            queues[group] = shuffle(bank[group].filter(function(q) { return picked.indexOf(q) === -1; }));
          }
          picked.push(queues[group].shift());
        }
        return picked;
      }

      function buildRound() {
        var round = [];
        Object.keys(perRound).forEach(function(group) {
          round = round.concat(take(group, perRound[group]));
        });
        round = shuffle(round);

        activity.innerHTML = '';
        round.forEach(function(q, i) {
          var parts = q.text.split('___');
          var answer = q.options[0];

          var sentence = document.createElement('div');
          sentence.className = 'dropdown-sentence';

          var number = document.createElement('span');
          number.className = 'sentence-number';
          number.textContent = i + 1;
          var speaker = document.createElement('strong');
          speaker.textContent = q.who + ':';

          var select = document.createElement('select');
          select.className = 'gap-dropdown';
          select.dataset.answer = answer;
          select.setAttribute('aria-label', 'Gap ' + (i + 1));
          var placeholder = new Option('Choose...', '');
          placeholder.disabled = true;
          placeholder.selected = true;
          select.appendChild(placeholder);
          shuffle(q.options).forEach(function(option) {
            select.appendChild(new Option(option, option));
          });
          select.addEventListener('change', function() {
            handleDropdownChange(select);
          });

          sentence.appendChild(number);
          // Some gaps are the reply to a question: show the question first
          if (q.before) {
            var asker = document.createElement('strong');
            asker.textContent = q.before.who + ':';
            sentence.appendChild(asker);
            sentence.appendChild(document.createTextNode(' ' + q.before.text + ' '));
          }
          sentence.appendChild(speaker);
          sentence.appendChild(document.createTextNode(' ' + parts[0]));
          sentence.appendChild(select);
          sentence.appendChild(document.createTextNode(parts[1]));
          activity.appendChild(sentence);
        });

        var feedback = document.getElementById('gapFillFeedback');
        feedback.className = 'feedback';
        feedback.textContent = '';
      }

      // drop-down.js restores saved answers by position. The questions change
      // every visit, so clear anything saved before it loads.
      removeDropdownState('gapFill');

      document.getElementById('gap-fill-submit').addEventListener('click', function() {
        checkDropdownAnswers('gapFill');
      });
      document.getElementById('gap-fill-restart').addEventListener('click', function() {
        removeDropdownState('gapFill');
        buildRound();
        activity.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });

      buildRound();

    });
  </script>
